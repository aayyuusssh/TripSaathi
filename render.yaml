# Free demo only: API + worker share one sleeping web service. See DEPLOYMENT.md.
# Root directory is the repository root, NOT apps/api or apps/worker.
services:
  - type: web
    name: tripsaathi-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --global pnpm@10.32.1 && pnpm install --frozen-lockfile --prod=false && pnpm build:backend
    startCommand: node scripts/start-cloud.cjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: hosted
      - key: AUTH_MODE
        value: clerk
      - key: WEB_ORIGIN
        value: https://trip-saathi-sigma.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: tripsaathi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tripsaathi-redis
          type: keyvalue
          property: connectionString
      - key: IMPORT_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AIRLABS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: FLIGHT_STATUS_PROVIDER
        value: AIRLABS
  - type: keyvalue
    name: tripsaathi-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: tripsaathi-db
    plan: free
    region: frankfurt
    databaseName: tripsaathi
    user: tripsaathi
    ipAllowList: []
