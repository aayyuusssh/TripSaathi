services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripsaathi
      POSTGRES_PASSWORD: tripsaathi_local
      POSTGRES_DB: tripsaathi
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["tripsaathi_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsaathi -d tripsaathi"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["tripsaathi_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  tripsaathi_pg:
  tripsaathi_redis:
